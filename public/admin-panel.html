<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SERVIYA.do — Administración</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}.shell{display:flex;min-height:100vh}.side{width:250px;background:#0b1f35;color:#fff;padding:22px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:22px;margin-bottom:6px}.sub{font-size:12px;color:#9fb0c4;margin-bottom:25px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd7e5;text-align:left;padding:11px 12px;border-radius:10px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#173a5d;color:#fff}.main{flex:1;padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.top h1{margin:0;font-size:25px}.muted{color:#66758a;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.primary{background:#1769aa;color:#fff}.danger{background:#b42318;color:#fff}.ok{background:#16835b;color:#fff}.light{background:#e8eef5;color:#19304a}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 2px 8px #0b1f3508}.kpi .n{font-size:25px;font-weight:900;margin-top:5px}.kpi .l{font-size:11px;color:#728198;text-transform:uppercase;font-weight:800}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.tablewrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:11px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}.table th{background:#f8fafc;color:#5c6b7e;font-size:10px;text-transform:uppercase}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8eef5;font-size:10px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input,.toolbar select{padding:9px;border:1px solid #d7e0ea;border-radius:9px;background:#fff}.empty{padding:30px;text-align:center;color:#7b899b}.toast{position:fixed;right:20px;bottom:20px;background:#102a43;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:5}.login{max-width:430px;margin:12vh auto}.login input{width:100%;padding:12px;margin:7px 0;border:1px solid #d7e0ea;border-radius:9px}.hidden{display:none!important}@media(max-width:900px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{display:block}.side{width:auto;height:auto;position:static}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<div id="login" class="login card"><div class="brand">SERVIYA.do 🇩🇴</div><div class="sub">Consola administrativa independiente</div><input id="token" placeholder="Pega aquí el token JWT del administrador"><button class="btn primary" style="width:100%;margin-top:8px" onclick="enter()">Entrar al panel</button><p class="muted">Solo usuarios con rol ADMIN pueden acceder a la API.</p></div>
<div id="app" class="shell hidden">
<aside class="side"><div class="brand">SERVIYA.do</div><div class="sub">ADMIN • Centro de control</div><div class="nav">
<button class="active" data-page="overview">📊 Dashboard</button><button data-page="users">👥 Usuarios</button><button data-page="services">🛠 Servicios</button><button data-page="applications">📋 Postulaciones</button><button data-page="finance">💰 Finanzas</button><button data-page="support">🎫 Soporte</button><button data-page="portfolio">🖼 Portafolio</button><button data-page="reviews">⭐ Reseñas</button><button data-page="audit">🛡 Auditoría</button></div><button class="btn light" style="margin-top:20px;width:100%" onclick="logout()">Cerrar sesión</button></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard administrativo</h1><div class="muted">Control operativo, financiero, moderación y auditoría.</div></div><button class="btn primary" onclick="loadCurrent()">↻ Actualizar</button></div><div id="content"></div></main></div>
<div id="toast" class="toast"></div>
<script>
const API='/api/v1/admin-panel';let token=localStorage.getItem('serviya_admin_token')||'';let current='overview';
const $=id=>document.getElementById(id);function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
async function req(path,opt={}){opt.headers={...(opt.headers||{}),'Authorization':'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(API+path,opt);let d=await r.json().catch(()=>({}));if(r.status===401||r.status===403)throw Error(d.detail||'Acceso denegado');if(!r.ok)throw Error(d.detail||'Error');return d}
function enter(){token=$('token').value.trim();if(!token)return;localStorage.setItem('serviya_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');loadCurrent()}
function logout(){localStorage.removeItem('serviya_admin_token');location.reload()}
async function loadCurrent(){try{if(current==='overview')return overview();if(current==='users')return users();if(current==='services')return services();if(current==='applications')return applications();if(current==='finance')return finance();if(current==='support')return support();if(current==='portfolio')return portfolio();if(current==='reviews')return reviews();if(current==='audit')return audit()}catch(e){toast(e.message)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.page;$('title').textContent=b.textContent.replace(/^\S+\s/,'');loadCurrent()});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function table(cols,rows){if(!rows.length)return '<div class="empty">No hay registros.</div>';return '<div class="tablewrap"><table class="table"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
async function overview(){let d=await req('/overview'),u=d.users,s=d.services,f=d.finance,m=d.moderation;$('content').innerHTML='<div class="grid">'+[['Usuarios',u.total],['Clientes',u.clients],['Técnicos',u.workers],['Usuarios inactivos',u.inactive],['Servicios',s.total],['En progreso',s.in_progress],['Custodia RD$',f.custody_rd.toLocaleString()],['Comisiones RD$',f.commission_rd.toLocaleString()],['Retiros pendientes',f.pending_withdrawals],['Verificaciones pendientes',m.pending_verifications],['Disputas abiertas',m.open_disputes],['Tickets abiertos',m.open_tickets]].map(x=>'<div class="card kpi"><div class="l">'+x[0]+'</div><div class="n">'+x[1]+'</div></div>').join('')+'</div><div class="section card"><h2>Resumen operativo</h2><div class="muted">Completados: '+s.completed+' · Publicados/recibiendo: '+s.published+' · Disputados: '+s.disputed+' · Portafolios: '+m.portfolio_items+' · Reseñas: '+m.reviews+'</div></div>'}
async function users(){let d=await req('/users');$('content').innerHTML='<div class="toolbar"><input id="uf" placeholder="Buscar nombre, email o provincia" oninput="filterTable(\'ut\',this.value)"></div>'+table(['Usuario','Rol','Ubicación','Verificado','Activo','Acción'],d.users.map(u=>'<tr><td id="ut"><b>'+esc(u.full_name||((u.first_name||'')+' '+(u.last_name||'')))+'</b><br>'+esc(u.email)+'<br>'+esc(u.phone)+'</td><td>'+esc(u.role)+'</td><td>'+esc(u.province)+'<br>'+esc(u.municipality)+'</td><td>'+esc(u.is_verified)+'</td><td>'+esc(u.is_active)+'</td><td><button class="btn '+(u.is_active?'danger':'ok')+'" onclick="state(\''+esc(u.id)+'\','+(!u.is_active)+')">'+(u.is_active?'Suspender':'Activar')+'</button></td></tr>').join(''))}
async function state(id,active){try{await req('/users/'+id+'/state',{method:'PATCH',body:JSON.stringify({is_active:active,reason:'Gestión administrativa'})});toast('Estado actualizado');users()}catch(e){toast(e.message)}}
async function services(){let d=await req('/services');$('content').innerHTML=table(['Servicio','Cliente','Precio','Lugar','Estado','Acción'],d.services.map(s=>'<tr><td><b>'+esc(s.title)+'</b><br>'+esc(s.category_name)+'<br><small>'+esc(s.description).slice(0,160)+'</small></td><td>'+esc(s.client_name)+'</td><td>RD$ '+Number(s.price_rd||0).toLocaleString()+'</td><td>'+esc(s.province)+'<br>'+esc(s.municipality)+'</td><td><span class="badge">'+esc(s.status)+'</span><br>Fotos: '+((s.images||[]).length)+' · Requisitos: '+((s.requirements||[]).length)+'</td><td><button class="btn danger" onclick="moderate(\''+esc(s.id)+'\',\'CANCELADA\')">Cancelar</button></td></tr>').join(''))}
async function moderate(id,status){try{await req('/services/'+id+'/moderation',{method:'PATCH',body:JSON.stringify({status,reason:'Moderación administrativa'})});toast('Servicio moderado');services()}catch(e){toast(e.message)}}
async function applications(){let d=await req('/applications');$('content').innerHTML=table(['Servicio','Técnico','Oferta','Estado','Mensaje','Fecha'],d.applications.map(a=>'<tr><td>'+esc(a.service_title)+'</td><td>'+esc(a.worker_name)+'</td><td>RD$ '+Number(a.offered_price_rd||0).toLocaleString()+'</td><td>'+esc(a.status)+'</td><td>'+esc(a.message)+'</td><td>'+esc(a.created_at)+'</td></tr>').join(''))}
async function finance(){let d=await req('/transactions');$('content').innerHTML=table(['Usuario','Tipo','Monto','Estado','Referencia','Fecha'],d.transactions.map(t=>'<tr><td>'+esc(t.user_name||t.user_id)+'</td><td>'+esc(t.type)+'</td><td>RD$ '+Number(t.amount||0).toLocaleString()+'</td><td>'+esc(t.status)+'</td><td>'+esc(t.reference_code)+'</td><td>'+esc(t.created_at)+'</td></tr>').join(''))}
async function support(){let d=await req('/support');$('content').innerHTML=table(['Ticket','Usuario','Tipo','Asunto','Estado','Respuesta','Acción'],d.tickets.map(t=>'<tr><td>#'+t.id+'</td><td>'+esc(t.user_name||t.user_id)+'</td><td>'+esc(t.ticket_type)+'</td><td>'+esc(t.subject)+'<br>'+esc(t.description).slice(0,130)+'</td><td>'+esc(t.status)+'</td><td>'+esc(t.admin_response||'—')+'</td><td><button class="btn ok" onclick="ticket('+t.id+',\'RESUELTO\')">Resolver</button></td></tr>').join(''))}
async function ticket(id,status){try{await req('/support/'+id,{method:'PATCH',body:JSON.stringify({status,admin_response:'Atendido por administración de SERVIYA.do'})});toast('Ticket actualizado');support()}catch(e){toast(e.message)}}
async function portfolio(){let d=await req('/portfolio');$('content').innerHTML=table(['Técnico','Proyecto','Descripción','Foto','Fecha'],d.portfolio.map(p=>'<tr><td>'+esc(p.worker_name||p.worker_id)+'</td><td>'+esc(p.title)+'</td><td>'+esc(p.description)+'</td><td><a href="'+esc(p.photo_url)+'" target="_blank">Ver foto</a></td><td>'+esc(p.created_at)+'</td></tr>').join(''))}
async function reviews(){let d=await req('/reviews');$('content').innerHTML=table(['Servicio','Quién calificó','Usuario evaluado','Puntuación','Comentario','Fecha'],d.reviews.map(r=>'<tr><td>'+esc(r.service_id)+'</td><td>'+esc(r.reviewer_name||r.reviewer_id)+'</td><td>'+esc(r.target_name||r.target_user_id)+'</td><td>⭐ '+esc(r.rating)+'</td><td>'+esc(r.comment)+'</td><td>'+esc(r.created_at)+'</td></tr>').join(''))}
async function audit(){let d=await req('/audit');$('content').innerHTML=table(['Fecha','Administrador','Acción','Recurso','Objetivo','Detalle'],d.admin_audit.map(a=>'<tr><td>'+esc(a.timestamp)+'</td><td>'+esc(a.admin_id)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.resource)+'</td><td>'+esc(a.target_id)+'</td><td>'+esc(a.details)+'</td></tr>').join(''))}
function filterTable(id,q){document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{if(i===0)return;r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none'})}
if(token){$('token').value=token;enter()}
</script></body></html>
